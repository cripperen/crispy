<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Crispy Music" />
<title>Crispy Music</title>
<style>
  :root{
    --bg: #0e1614;
    --panel: #172420;
    --panel-2: #1e2c26;
    --accent: #6be3a8;
    --accent-2: #7c6bff;
    --text: #eef5f1;
    --muted: #7d9089;
    --font-heading: "Futura", "Avenir Next", "Century Gothic", sans-serif;
    --font-body: "Avenir Next", "Futura", -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
  }
  .app{
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }

  h1{
    text-align:center;
    font-family: var(--font-heading);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 26px 0 4px;
    margin:0;
  }
  h1 span{ color: var(--accent); }

  .view{ display:none; flex:1; padding: 10px 20px 20px; }
  .view.active{ display:block; }

  /* HOME */
  #home{ text-align:center; }

  #title{ font-family: var(--font-heading); font-size: 22px; font-weight:700; margin-top: 60px; }
  #filename{ font-size: 13px; color: var(--muted); margin-top: 2px; }

  .progress{
    width:100%;
    height: 6px;
    background: #3a3a3a;
    border-radius: 4px;
    margin: 20px 0 6px;
    cursor:pointer;
    overflow:hidden;
  }
  .progress-fill{ height:100%; width:0%; background: var(--accent); }
  .times{ display:flex; justify-content:space-between; font-size:12px; color: var(--muted); }

  .controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    margin-top: 20px;
  }
  .controls button{
    background: var(--panel);
    border: none;
    color: var(--text);
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    position: relative;
  }
  .controls button svg{
    width: 20px;
    height: 20px;
  }
  #play{
    width: 62px; height: 62px;
    background: var(--accent);
    color: #0e1614;
  }
  #play svg{ width: 24px; height: 24px; }
  .controls button:hover{ opacity: 0.85; }
  #more.active{ color: var(--accent); }

  .dot{
    position:absolute;
    top:6px; right:6px;
    width:7px; height:7px;
    border-radius:50%;
    background: var(--accent);
    display:none;
  }
  .dot.show{ display:block; }

  /* MORE PANEL */
  .more-panel{
    display:none;
    margin-top: 16px;
    background: var(--panel);
    border-radius: 14px;
    overflow:hidden;
    text-align:left;
  }
  .more-panel.show{ display:block; }
  .more-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:14px;
    padding: 15px 16px;
    background:none;
    border:none;
    border-bottom: 1px solid var(--panel-2);
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-body);
    cursor:pointer;
  }
  .more-item:last-child{ border-bottom:none; }
  .more-item svg{ width:20px; height:20px; flex-shrink:0; color: var(--muted); }
  .more-item.active{ color: var(--accent); }
  .more-item.active svg{ color: var(--accent); }
  .more-status{
    margin-left:auto;
    font-size: 12.5px;
    color: var(--muted);
  }
  .more-item.active .more-status{ color: var(--accent); }

  /* MUSIC LIST */
  #music h2{ font-size:18px; margin: 10px 0; }
  #list{ list-style:none; margin:0; padding:0; }
  #list li{
    padding: 12px 10px;
    border-bottom: 1px solid #333;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
  }
  #list li:hover{ background: var(--panel); }
  #list li.active{ color: var(--accent); }
  .empty{ color: var(--muted); font-size: 14px; line-height:1.6; padding-top: 10px;}
  .empty code{ background: var(--panel); padding: 1px 5px; border-radius:4px; }

  /* NAV */
  nav{
    display:flex;
    border-top: 1px solid #333;
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    color: var(--muted);
    padding: 22px 0;
    font-family: var(--font-heading);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor:pointer;
  }
  nav button.active{ color: var(--accent); }

  audio{ display:none; }
</style>
</head>
<body>
<div class="app">

  <h1>Crispy <span>Music</span></h1>

  <section id="home" class="view active">
    <div id="title">Nothing playing</div>
    <div id="filename">Press Play to start a random song</div>

    <div class="progress" id="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="times">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg>
      </button>
      <button id="reset" title="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <path d="M3 4v5h5"/>
        </svg>
      </button>
      <button id="play" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button id="more" title="More">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
        <span class="dot" id="moreDot"></span>
      </button>
    </div>

    <div class="more-panel" id="morePanel">
      <button class="more-item" id="loopBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
          <path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </svg>
        <span>Loop</span>
        <span class="more-status" id="loopStatus">Off</span>
      </button>
      <button class="more-item" id="shuffleBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5"/><path d="M4 20L21 3"/><path d="M21 16v5h-5"/>
          <path d="M15 15l6 6"/><path d="M4 4l5 5"/>
        </svg>
        <span>Shuffle</span>
        <span class="more-status" id="shuffleStatus">Off</span>
      </button>
      <button class="more-item" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="M7 9l5-5 5 5"/>
          <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
        </svg>
        <span>Share this song</span>
      </button>
    </div>
  </section>

  <section id="music" class="view">
    <h2>Music</h2>
    <ul id="list"></ul>
  </section>

  <nav>
    <button id="navHome" class="active">Home</button>
    <button id="navMusic">Music</button>
  </nav>

  <audio id="audio"></audio>
</div>

<script>
/* =====================================================================
   1) Put your mp3 files inside the "music" folder next to this file.
   2) List them here, EXACTLY matching the filenames (including .mp3).
      "title" is optional — leave it out and the filename is used.
   ===================================================================== */
const SONGS = [
  { file: "Tunnel Vision ft. Fed.mp3", title: "Tunnel Vision - Bare Benja (Ft. Fed)" },
  { file: "Tristan & Isolde.mp3", title: "Tristan & Isolde - Hans Philip" },
  { file: "Bliv hvor du er.mp3", title: "Bliv Hvor Du Er - Artigeardit (Ft. Rosa)" },
  { file: "Du Ligner Din Mor.mp3", title: "Du Ligner Din Mor - Benjamin Hav (Ft. Lukas Forchhammer)" },
  { file: "Os-To.mp3", title: "Os To - Bare Benja" },
  { file: "Hold-Mit-Tempo.mp3", title: "Hold Mit Tempo - Lamin (Ft. Annika)" },
  { file: "Ikaros.mp3", title: "Ikaros - Ozzy" },
  { file: "Mona-Lisa.mp3", title: "Mona Lisa - KESI (Ft. Lord Siva)" },
  { file: "Skinz-Jeg-Har-En-Pige-Officiel-musikvideo.mp3", title: "Jeg Har En Pige - Skinz" },
  { file: "Næste Sommer.mp3", title: "Næste Sommer - STOR KAEFT" },
  { file: "Killa.mp3", title: "Killa - Bare Benja" },
  { file: "Hvor blev tiden af.mp3", title: "Hvor Blev Tiden Af - KESI (Ft. Hans Philip)" },
];

const MUSIC_FOLDER = "music/";

/* ===================================================================== */

const audio = document.getElementById('audio');
let current = -1;
let playing = false;
let shuffleMode = false;

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

const el = {
  title: document.getElementById('title'),
  filename: document.getElementById('filename'),
  progress: document.getElementById('progress'),
  progressFill: document.getElementById('progressFill'),
  currentT: document.getElementById('current'),
  durationT: document.getElementById('duration'),
  play: document.getElementById('play'),
  playIcon: document.getElementById('playIcon'),
  list: document.getElementById('list'),
  navHome: document.getElementById('navHome'),
  navMusic: document.getElementById('navMusic'),
  home: document.getElementById('home'),
  music: document.getElementById('music'),
  more: document.getElementById('more'),
  moreDot: document.getElementById('moreDot'),
  morePanel: document.getElementById('morePanel'),
  loopBtn: document.getElementById('loopBtn'),
  loopStatus: document.getElementById('loopStatus'),
  shuffleBtn: document.getElementById('shuffleBtn'),
  shuffleStatus: document.getElementById('shuffleStatus'),
  shareBtn: document.getElementById('shareBtn'),
};

function formatTime(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return m + ":" + String(sec).padStart(2,"0");
}

function renderList(){
  el.list.innerHTML = "";
  if(SONGS.length === 0){
    el.list.innerHTML = '<div class="empty">No songs listed yet. Open <code>index.html</code>, find the <code>SONGS</code> list near the top of the script, and add your mp3 filenames there.</div>';
    return;
  }
  SONGS.forEach((song, i) => {
    const li = document.createElement('li');
    li.textContent = song.title || song.file;
    li.dataset.i = i;
    li.addEventListener('click', () => loadSong(i, true));
    el.list.appendChild(li);
  });
  highlightList();
}

function highlightList(){
  [...el.list.children].forEach(li => {
    li.classList.toggle('active', Number(li.dataset.i) === current);
  });
}

function loadSong(i, autoplay){
  if(SONGS.length === 0) return;
  if(i < 0) i = SONGS.length - 1;
  if(i >= SONGS.length) i = 0;
  current = i;
  const song = SONGS[i];
  audio.src = MUSIC_FOLDER + encodeURIComponent(song.file);
  el.title.textContent = song.title || song.file;
  el.filename.textContent = song.file;
  highlightList();
  updateMediaSession(song);
  if(autoplay){
    audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
  }
}

function playRandom(){
  if(SONGS.length === 0){
    el.title.textContent = "No songs found";
    el.filename.textContent = "Add mp3s to the music folder and list them in SONGS";
    return;
  }
  let i;
  do{ i = Math.floor(Math.random() * SONGS.length); }
  while(SONGS.length > 1 && i === current);
  loadSong(i, true);
}

function togglePlay(){
  if(current === -1){ playRandom(); return; }
  if(playing){ audio.pause(); setPlaying(false); }
  else{ audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false)); }
}

function resetSong(){
  if(current === -1) return;
  audio.currentTime = 0;
}

function nextSong(){ if(SONGS.length) loadSong(current + 1, true); }
function prevSong(){ if(SONGS.length) loadSong(current - 1, true); }

function setPlaying(p){
  playing = p;
  el.playIcon.innerHTML = p ? ICON_PAUSE : ICON_PLAY;
  el.play.title = p ? "Pause" : "Play";
  if('mediaSession' in navigator){
    navigator.mediaSession.playbackState = p ? "playing" : "paused";
  }
}

function updateProgress(){
  const d = audio.duration || 0;
  const c = audio.currentTime || 0;
  el.progressFill.style.width = (d ? (c/d*100) : 0) + "%";
  el.currentT.textContent = formatTime(c);
  el.durationT.textContent = formatTime(d);
}

function showView(name){
  const home = name === 'home';
  el.home.classList.toggle('active', home);
  el.music.classList.toggle('active', !home);
  el.navHome.classList.toggle('active', home);
  el.navMusic.classList.toggle('active', !home);
}

el.navHome.addEventListener('click', () => { showView('home'); playRandom(); });
el.navMusic.addEventListener('click', () => showView('music'));
el.play.addEventListener('click', togglePlay);
document.getElementById('reset').addEventListener('click', resetSong);
document.getElementById('next').addEventListener('click', nextSong);
document.getElementById('prev').addEventListener('click', prevSong);

/* ---------------- More panel: Loop / Shuffle / Share ---------------- */

el.more.addEventListener('click', () => {
  const showing = el.morePanel.classList.toggle('show');
  el.more.classList.toggle('active', showing);
});

el.loopBtn.addEventListener('click', () => {
  audio.loop = !audio.loop;
  el.loopBtn.classList.toggle('active', audio.loop);
  el.loopStatus.textContent = audio.loop ? "On" : "Off";
  updateMoreDot();
});

el.shuffleBtn.addEventListener('click', () => {
  shuffleMode = !shuffleMode;
  el.shuffleBtn.classList.toggle('active', shuffleMode);
  el.shuffleStatus.textContent = shuffleMode ? "On" : "Off";
  updateMoreDot();
});

el.shareBtn.addEventListener('click', shareSong);

function updateMoreDot(){
  el.moreDot.classList.toggle('show', audio.loop || shuffleMode);
}

function shareSong(){
  const text = current === -1
    ? "Check out Crispy Music 🎵"
    : "Listening to \"" + (SONGS[current].title || SONGS[current].file) + "\" on Crispy Music 🎵";

  if(navigator.share){
    navigator.share({ text }).catch(() => {});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard:\n" + text));
  } else {
    alert(text);
  }
}

/* ---------------- Progress bar ---------------- */

el.progress.addEventListener('click', (e) => {
  const rect = el.progress.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(audio.duration) audio.currentTime = pct * audio.duration;
});

/* ---------------- Audio events ---------------- */

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', updateProgress);
audio.addEventListener('play', () => {
  setPlaying(true);
  if(current !== -1) updateMediaSession(SONGS[current]);
});
audio.addEventListener('pause', () => setPlaying(false));
audio.addEventListener('ended', () => {
  // if loop is on, the browser restarts the song natively and 'ended' won't fire.
  // this only runs for a normal, non-looping finish:
  if(shuffleMode) playRandom();
  else nextSong();
});
audio.addEventListener('error', () => {
  if(current !== -1) el.filename.textContent = "Couldn't load " + SONGS[current].file + " — check it's in the music folder";
});

/* ---------------- Lock screen / background playback controls ----------------
   The Media Session API tells iOS/Android this page is playing media, so
   playback keeps going and shows controls on the lock screen / control
   center when your phone is locked or the browser is in the background.
   It does NOT let a page start playing on its own without you pressing
   play first — that part still needs one tap.
------------------------------------------------------------------------ */
function makeArtwork(){
  // A simple generated icon, since individual songs don't have cover art.
  // Some phones only show the full "Now Playing" info (title + artist)
  // once artwork is present, so this makes the lock screen more reliable.
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 512, 512);
  grad.addColorStop(0, '#6be3a8');
  grad.addColorStop(1, '#7c6bff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 512, 512);
  ctx.fillStyle = '#0e1614';
  ctx.font = '700 220px "Futura", "Avenir Next", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('♪', 256, 280);
  return c.toDataURL('image/png');
}
const ARTWORK_URL = makeArtwork();

function updateMediaSession(song){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title || song.file,
    artist: "Crispy Music",
    artwork: [
      { src: ARTWORK_URL, sizes: '512x512', type: 'image/png' }
    ]
  });
}

if('mediaSession' in navigator){
  const safeHandler = (action, handler) => {
    try{ navigator.mediaSession.setActionHandler(action, handler); }
    catch(e){ /* not supported on this browser, ignore */ }
  };
  safeHandler('play', () => { audio.play(); });
  safeHandler('pause', () => { audio.pause(); });
  safeHandler('previoustrack', prevSong);
  safeHandler('nexttrack', nextSong);
  // Explicitly disable the 10s seek buttons so iOS shows previous/next
  // track buttons on the lock screen instead.
  safeHandler('seekbackward', null);
  safeHandler('seekforward', null);
  safeHandler('seekto', null);
}

renderList();
setPlaying(false);
</script>
</body>
</html>
