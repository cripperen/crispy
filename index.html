<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Crispy Music" />
<title>Crispy Music</title>
<style>
  :root{
    --bg: #0e1614;
    --panel: #172420;
    --accent: #6be3a8;
    --accent-2: #7c6bff;
    --text: #eef5f1;
    --muted: #7d9089;
    --font-heading: "Futura", "Avenir Next", "Century Gothic", sans-serif;
    --font-body: "Avenir Next", "Futura", -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
  }
  .app{
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
  }

  h1{
    text-align:center;
    font-family: var(--font-heading);
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.02em;
    padding: 26px 0 4px;
    margin:0;
  }
  h1 span{ color: var(--accent); }

  .view{ display:none; flex:1; padding: 10px 20px 20px; }
  .view.active{ display:block; }

  /* HOME */
  #home{ text-align:center; }

  #title{ font-family: var(--font-heading); font-size: 22px; font-weight:700; margin-top: 60px; }
  #filename{ font-size: 13px; color: var(--muted); margin-top: 2px; }

  .progress{
    width:100%;
    height: 6px;
    background: #3a3a3a;
    border-radius: 4px;
    margin: 20px 0 6px;
    cursor:pointer;
    overflow:hidden;
  }
  .progress-fill{ height:100%; width:0%; background: var(--accent); }
  .times{ display:flex; justify-content:space-between; font-size:12px; color: var(--muted); }

  .controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    margin-top: 20px;
  }
  .controls button{
    background: var(--panel);
    border: none;
    color: var(--text);
    width: 48px; height: 48px;
    border-radius: 50%;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .controls button svg{
    width: 20px;
    height: 20px;
  }
  #play{
    width: 62px; height: 62px;
    background: var(--accent);
    color: #0e1614;
  }
  #play svg{ width: 24px; height: 24px; }
  .controls button:hover{ opacity: 0.85; }

  /* MUSIC LIST */
  #music h2{ font-size:18px; margin: 10px 0; }
  #list{ list-style:none; margin:0; padding:0; }
  #list li{
    padding: 12px 10px;
    border-bottom: 1px solid #333;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
  }
  #list li:hover{ background: var(--panel); }
  #list li.active{ color: var(--accent); }
  .empty{ color: var(--muted); font-size: 14px; line-height:1.6; padding-top: 10px;}
  .empty code{ background: var(--panel); padding: 1px 5px; border-radius:4px; }

  /* NAV */
  nav{
    display:flex;
    border-top: 1px solid #333;
  }
  nav button{
    flex:1;
    background:none;
    border:none;
    color: var(--muted);
    padding: 22px 0;
    font-family: var(--font-heading);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: 0.02em;
    cursor:pointer;
  }
  nav button.active{ color: var(--accent); }

  audio{ display:none; }
</style>
</head>
<body>
<div class="app">

  <h1>Crispy <span>Music</span></h1>

  <section id="home" class="view active">
    <div id="title">Nothing playing</div>
    <div id="filename">Press Home to pick a random song</div>

    <div class="progress" id="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="times">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg>
      </button>
      <button id="reset" title="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <path d="M3 4v5h5"/>
        </svg>
      </button>
      <button id="play" title="Play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button id="next" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
      </button>
      <button id="share" title="Share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/>
          <path d="M7 9l5-5 5 5"/>
          <path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>
        </svg>
      </button>
    </div>
  </section>

  <section id="music" class="view">
    <h2>Music</h2>
    <ul id="list"></ul>
  </section>

  <nav>
    <button id="navHome" class="active">Home</button>
    <button id="navMusic">Music</button>
  </nav>

  <audio id="audio"></audio>
</div>

<script>
/* =====================================================================
   1) Put your mp3 files inside the "music" folder next to this file.
   2) List them here, EXACTLY matching the filenames (including .mp3).
      "title" is optional — leave it out and the filename is used.
   ===================================================================== */
const SONGS = [
  { file: "Tunnel Vision ft. Fed.mp3", title: "Tunnel Vision" },
  { file: "Tristan & Isolde.mp3", title: "Tristan & Isolde" },
  { file: "Bliv hvor du er.mp3", title: "Bliv hvor du er" },
  { file: "Du Ligner Din Mor.mp3", title: "Du Ligner Din Mor" },
];

const MUSIC_FOLDER = "music/";

/* ===================================================================== */

const audio = document.getElementById('audio');
let current = -1;
let playing = false;

const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
const ICON_PAUSE = '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';

const el = {
  title: document.getElementById('title'),
  filename: document.getElementById('filename'),
  progress: document.getElementById('progress'),
  progressFill: document.getElementById('progressFill'),
  currentT: document.getElementById('current'),
  durationT: document.getElementById('duration'),
  play: document.getElementById('play'),
  playIcon: document.getElementById('playIcon'),
  list: document.getElementById('list'),
  navHome: document.getElementById('navHome'),
  navMusic: document.getElementById('navMusic'),
  home: document.getElementById('home'),
  music: document.getElementById('music'),
};

function formatTime(s){
  if(!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return m + ":" + String(sec).padStart(2,"0");
}

function renderList(){
  el.list.innerHTML = "";
  if(SONGS.length === 0){
    el.list.innerHTML = '<div class="empty">No songs listed yet. Open <code>index.html</code>, find the <code>SONGS</code> list near the top of the script, and add your mp3 filenames there.</div>';
    return;
  }
  SONGS.forEach((song, i) => {
    const li = document.createElement('li');
    li.textContent = song.title || song.file;
    li.dataset.i = i;
    li.addEventListener('click', () => loadSong(i, true));
    el.list.appendChild(li);
  });
  highlightList();
}

function highlightList(){
  [...el.list.children].forEach(li => {
    li.classList.toggle('active', Number(li.dataset.i) === current);
  });
}

function loadSong(i, autoplay){
  if(SONGS.length === 0) return;
  if(i < 0) i = SONGS.length - 1;
  if(i >= SONGS.length) i = 0;
  current = i;
  const song = SONGS[i];
  audio.src = MUSIC_FOLDER + encodeURIComponent(song.file);
  el.title.textContent = song.title || song.file;
  el.filename.textContent = song.file;
  highlightList();
  if(autoplay){
    audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false));
  }
}

function playRandom(){
  if(SONGS.length === 0){
    el.title.textContent = "No songs found";
    el.filename.textContent = "Add mp3s to the music folder and list them in SONGS";
    return;
  }
  let i;
  do{ i = Math.floor(Math.random() * SONGS.length); }
  while(SONGS.length > 1 && i === current);
  loadSong(i, true);
}

function togglePlay(){
  if(current === -1){ playRandom(); return; }
  if(playing){ audio.pause(); setPlaying(false); }
  else{ audio.play().then(() => setPlaying(true)).catch(() => setPlaying(false)); }
}

function resetSong(){
  if(current === -1) return;
  audio.currentTime = 0;
}

function nextSong(){ if(SONGS.length) loadSong(current + 1, true); }
function prevSong(){ if(SONGS.length) loadSong(current - 1, true); }

function setPlaying(p){
  playing = p;
  el.playIcon.innerHTML = p ? ICON_PAUSE : ICON_PLAY;
  el.play.title = p ? "Pause" : "Play";
}

function updateProgress(){
  const d = audio.duration || 0;
  const c = audio.currentTime || 0;
  el.progressFill.style.width = (d ? (c/d*100) : 0) + "%";
  el.currentT.textContent = formatTime(c);
  el.durationT.textContent = formatTime(d);
}

function showView(name){
  const home = name === 'home';
  el.home.classList.toggle('active', home);
  el.music.classList.toggle('active', !home);
  el.navHome.classList.toggle('active', home);
  el.navMusic.classList.toggle('active', !home);
}

el.navHome.addEventListener('click', () => { showView('home'); playRandom(); });
el.navMusic.addEventListener('click', () => showView('music'));
el.play.addEventListener('click', togglePlay);
document.getElementById('reset').addEventListener('click', resetSong);
document.getElementById('next').addEventListener('click', nextSong);
document.getElementById('prev').addEventListener('click', prevSong);
document.getElementById('share').addEventListener('click', shareSong);

function shareSong(){
  const text = current === -1
    ? "Check out Crispy Music 🎵"
    : "Listening to \"" + (SONGS[current].title || SONGS[current].file) + "\" on Crispy Music 🎵";

  if(navigator.share){
    navigator.share({ text }).catch(() => {});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => alert("Copied to clipboard:\n" + text));
  } else {
    alert(text);
  }
}

el.progress.addEventListener('click', (e) => {
  const rect = el.progress.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(audio.duration) audio.currentTime = pct * audio.duration;
});

audio.addEventListener('timeupdate', updateProgress);
audio.addEventListener('loadedmetadata', updateProgress);
audio.addEventListener('ended', nextSong);
audio.addEventListener('error', () => {
  if(current !== -1) el.filename.textContent = "Couldn't load " + SONGS[current].file + " — check it's in the music folder";
});

renderList();
setPlaying(false);
</script>
</body>
</html>
